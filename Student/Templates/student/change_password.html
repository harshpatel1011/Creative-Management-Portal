{% extends 'student/base.html' %}

{% block title %}Change Password - Creative Student Portal{% endblock %}

{% block content %}
<div class="page-header">
    <div class="header-text">
        <h1>Change Password</h1>
        <p>Update your student portal login password</p>
    </div>
</div>

<div class="student-card" style="max-width: 600px; margin: 0 auto; padding: 2.5rem;">
    <h2 class="form-section-title"><i class="fa-solid fa-key"></i> Security Credentials</h2>

    <form method="POST" action="{% url 'student_change_password' %}">
        {% csrf_token %}
        <div class="form-grid" style="grid-template-columns: 1fr;">
            <div class="form-group">
                <label class="form-label" for="current_password">Current Password *</label>
                <input type="password" id="current_password" name="current_password" class="form-input" placeholder="Enter your current password" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="new_password">New Password *</label>
                <input type="password" id="new_password" name="new_password" class="form-input" placeholder="Enter new password" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirm New Password *</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Re-enter new password" required>
            </div>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
            <a href="{% url 'student_profile' %}" class="btn-secondary">Cancel</a>
            <button type="submit" class="btn-primary">
                <i class="fa-solid fa-lock"></i> Update Password
            </button>
        </div>
    </form>
</div>
{% endblock %}
