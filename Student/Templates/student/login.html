{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Creative</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Design System CSS -->
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Brand Header -->
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; margin-bottom: 1.25rem;">
                <div style="margin-bottom: 0.75rem;">
                    <img src="{% static 'creative-logo-blue.svg' %}" alt="Creative Logo" style="height: 38px; width: auto; object-fit: contain;">
                </div>
                <h1 style="font-size: 1.35rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.25rem;">
                    Student Portal
                </h1>
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin: 0;">
                    Sign in to view your projects, grades, and academic standing
                </p>
            </div>

            <!-- Django Alert Messages -->
            {% if messages %}
                <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.5rem;">
                    {% for message in messages %}
                        <div style="display: flex; align-items: flex-start; gap: 0.65rem; padding: 0.75rem 1rem; border-radius: var(--border-radius-sm); font-size: 0.82rem; line-height: 1.4; {% if message.tags == 'error' %}background: var(--danger-light); color: var(--danger-text); border: 1px solid var(--danger-border);{% else %}background: var(--success-light); color: var(--success-text); border: 1px solid var(--success-border);{% endif %}">
                            <i class="fa-solid {% if message.tags == 'error' %}fa-circle-exclamation{% else %}fa-circle-check{% endif %}" style="font-size: 0.95rem; margin-top: 1px; flex-shrink: 0;"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <!-- Login Form -->
            <form method="POST" action="">
                {% csrf_token %}
                <div class="form-grid" style="grid-template-columns: 1fr; gap: 1rem; margin-bottom: 1.25rem;">
                    <div class="form-group">
                        <label class="form-label" for="email">Registered Student Email</label>
                        <div style="position: relative;">
                            <input class="form-input" type="email" id="email" name="email" placeholder="student@creative.com" required autofocus style="padding-left: 2.25rem;">
                            <i class="fa-solid fa-graduation-cap" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem;"></i>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div style="position: relative;">
                            <input class="form-input" type="password" id="password" name="password" placeholder="••••••••" required style="padding-left: 2.25rem;">
                            <i class="fa-solid fa-lock" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem;"></i>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary" style="width: 100%; height: 42px; font-size: 0.9rem;">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    <span>Sign In to Student Portal</span>
                </button>
            </form>

            <div style="text-align: center; margin-top: 0.75rem; padding-top: 1rem; border-top: 1px solid var(--border-color); font-size: 0.82rem; color: var(--text-secondary);">
                <span>Are you a faculty or administrator?</span>
                <a href="{% url 'admin_login' %}" style="color: var(--primary); font-weight: 600; margin-left: 4px;">Management Login</a>
            </div>
        </div>
    </div>
</body>
</html>
